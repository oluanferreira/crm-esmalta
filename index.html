function render(){nav();title.textContent={today:'Hoje',agenda:'Agenda',returns:'Retornos',clients:'Clientes',settings:'Configurações'}[tab];content.innerHTML=tab==='today'?todayHTML():tab==='agenda'?agendaHTML():tab==='returns'?returnsHTML():tab==='clients'?clientsHTML():settingsHTML()}
function todayHTML(){let d=today(),as=A.filter(a=>a.date===d&&a.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time)),now=new Date(),nm=now.getHours()*60+now.getMinutes(),next=as.find(a=>a.status!=='done'&&tmin(a.time)+P[a.procedure].min>=nm)||as.find(a=>a.status!=='done'),rs=returns().filter(r=>r.notify<=d&&!future(r)).sort((a,b)=>a.due.localeCompare(b.due)),ws=wstart(d),we=add(ws,5),week=A.filter(a=>a.date>=ws&&a.date<=we&&a.status!=='cancelled'),rev=week.reduce((s,a)=>s+P[a.procedure].price,0),gaps=segments(d).filter(s=>s.k==='free'&&s.e-s.s>=50).slice(0,3),share=`Resumo Esmalta — ${fmt(ws)} a ${fmt(we)}\n• ${week.length} atendimentos agendados\n• ${money(rev)} de receita prevista\n• ${rs.length} clientes para contato hoje`;return `<div class="today-grid"><section class="focus"><div class="eyebrow">AGORA</div>${next?`<div class="time">${next.time}</div><h2>${next.client}</h2><p>${P[next.procedure].name} · ${money(P[next.procedure].price)}</p><button class="textbtn" onclick="openAppt(${next.id})">Abrir atendimento →</button>`:`<h2>Agenda tranquila</h2><p>Nenhum próximo atendimento pendente hoje.</p>`}</section><section class="card pane"><div class="head"><div><div class="eyebrow">CONTATAR HOJE</div><h2>${rs.length} cliente${rs.length!==1?'s':''}</h2></div><span class="count">${rs.length}</span></div>${rs.slice(0,3).map(r=>rowReturn(r)).join('')||'<div class="empty">Nenhum retorno pendente hoje.</div>'}</section><section class="card pane"><div class="head"><div><div class="eyebrow">AGENDA DE HOJE</div><h2>${as.length} atendimento${as.length!==1?'s':''}</h2></div><button class="textbtn" onclick="sel=today();view='day';go('agenda')">Ver agenda</button></div>${as.slice(0,4).map(a=>`<button class="row" style="width:100%;border-left:0;border-right:0;border-bottom:0;background:#fff;text-align:left" onclick="openAppt(${a.id})"><strong>${a.time}</strong><div><strong>${a.client}</strong><span>${P[a.procedure].name}</span></div><b>›</b></button>`).join('')||'<div class="empty">Nenhum atendimento hoje.</div>'}</section><section class="card pane"><div class="head"><div><div class="eyebrow">SEMANA</div><h2>Visão rápida</h2></div><a class="icon" target="_blank" href="https://wa.me/?text=${encodeURIComponent(share)}">↗</a></div><div class="metrics"><div class="metric"><strong>${week.length}</strong><span>agendados</span></div><div class="metric"><strong>${money(rev)}</strong><span>receita prevista</span></div><div class="metric"><strong>${rs.length}</strong><span>contatos hoje</span></div></div>${gaps.length?`<div style="margin-top:12px;font-size:10px;color:#888">Janelas hoje: ${gaps.map(g=>`${mt(g.s)}–${mt(g.e)}`).join(' · ')}</div>`:''}</section></div>`}
function rowReturn(r){return `<div class="row"><div class="avatar">${ini(r.name)}</div><div><strong>${r.name}</strong><span>${r.type==='return'?P[r.suggest].name+' · ideal '+fmt(r.due):'Reativar · última '+fmt(r.lastVisit)}</span></div><button class="mini" onclick="scheduleReturn(${r.id})">Agendar</button></div>`}
function agendaHTML(){return `<div class="agenda"><section class="card toolbar"><div class="views"><button class="${view==='day'?'active':''}" onclick="view='day';render()">Dia</button><button class="${view==='week'?'active':''}" onclick="view='week';render()">Semana</button><button class="${view==='month'?'active':''}" onclick="view='month';render()">Mês</button></div><div class="date-nav"><button class="icon" onclick="shift(-1)">‹</button><button class="date-label" onclick="sel=today();view='day';render()"><strong>${view==='month'?fmt(sel,{month:'long',year:'numeric'}):view==='week'?'Semana de '+fmt(wstart(sel)):long(sel)}</strong><small>${sel===today()?'Hoje':'Ir para hoje'}</small></button><button class="icon" onclick="shift(1)">›</button></div></section>${view==='day'?dayHTML():view==='week'?weekHTML():monthHTML()}</div>`}function shift(n){sel=view==='day'?add(sel,n):view==='week'?add(sel,n*7):monthAdd(sel,n);render()}
function dayHTML(){let r=work(sel),as=A.filter(a=>a.date===sel&&a.status!=='cancelled');if(!r)return `<section class="card day"><div class="empty" style="text-align:center;padding:60px">Domingo · sem atendimento.</div></section>`;return `<section class="card day"><div class="dayhead"><div><div class="eyebrow">${sel===today()?'HOJE':'AGENDA'}</div><h2>${as.length} atendimento${as.length!==1?'s':''}</h2></div><span>${mt(r[0])}–${mt(r[1])}</span></div><div class="timeline">${segments(sel).map(s=>s.k==='appt'?`<button class="appt ${s.a.status}" onclick="openAppt(${s.a.id})"><div class="times"><strong>${s.a.time}</strong><span>${mt(s.e)}</span></div><div class="info"><strong>${s.a.client}</strong><span>${P[s.a.procedure].name} · ${money(P[s.a.procedure].price)}</span></div><i class="dot ${s.a.status}"></i><b>›</b></button>`:`<button class="free ${s.e-s.s<50?'short':''}" ${s.e-s.s<50?'disabled':''} onclick="openNew('${sel}','${mt(s.s)}','${s.e-s.s>=80?'manutencao':'peOuMao'}')"><span>${mt(s.s)}</span><div><strong>${s.e-s.s>=50?'Horário livre':'Intervalo'}</strong><small>${s.e-s.s} min disponíveis</small></div>${s.e-s.s>=50?'<b>+</b>':''}</button>`).join('')}</div></section>`}
function weekHTML(){let st=wstart(sel),ds=Array.from({length:6},(_,i)=>add(st,i));return `<section class="week">${ds.map(d=>{let as=A.filter(a=>a.date===d&&a.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time)),g=segments(d).filter(s=>s.k==='free'&&s.e-s.s>=50);return `<article class="card wday ${d===today()?'today':''}"><button class="whead" onclick="sel='${d}';view='day';render()"><span>${weekday(d)}</span><strong>${obj(d).getDate()}</strong><small>${as.length} atend.</small></button><div class="wevents">${as.map(a=>`<button class="wevent" onclick="openAppt(${a.id})"><span>${a.time}</span><strong>${a.client.split(' ')[0]}</strong><small>${P[a.procedure].name}</small></button>`).join('')||'<span class="empty">Livre</span>'}</div><button class="wfree" onclick="sel='${d}';view='day';render()">${g.length?g.length+' janela'+(g.length>1?'s':'')+' livre'+(g.length>1?'s':''):'Sem encaixes'}</button></article>`}).join('')}</section>`}
function monthHTML(){let d=obj(sel),y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1,12);let st=new Date(f);st.setDate(f.getDate()-f.getDay());let cells=Array.from({length:42},(_,i)=>{let x=new Date(st);x.setDate(st.getDate()+i);return iso(x)});return `<section class="card month"><div class="weekdays">${['D','S','T','Q','Q','S','S'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="monthgrid">${cells.map(x=>{let inside=obj(x).getMonth()===m,as=A.filter(a=>a.date===x&&a.status!=='cancelled'),r=work(x),book=as.reduce((s,a)=>s+P[a.procedure].min,0),cap=r?r[1]-r[0]:1,l=!r?'closed':book/cap>.7?'busy':book/cap>.25?'medium':'light';return `<button class="mday ${!inside?'out':''} ${x===today()?'today':''} ${l}" onclick="sel='${x}';view='day';render()"><span>${obj(x).getDate()}</span>${as.length?'<b>'+as.length+'</b>':''}<i></i></button>`}).join('')}</div><div class="legend"><span><i></i>livre</span><span><i class="med"></i>parcial</span><span><i class="busy"></i>ocupado</span></div></section>`}
function returnsHTML(){let rs=returns().sort((a,b)=>a.notify.localeCompare(b.notify)),now=rs.filter(r=>r.notify<=today()&&!future(r)),next=rs.filter(r=>r.notify>today());return `<div class="returns"><section class="card pane"><div class="head"><div><div class="eyebrow">RECORRÊNCIA</div><h2>Ação agora</h2><p>Atrasadas ou com contato previsto até hoje</p></div><span class="count">${now.length}</span></div>${now.map(retCard).join('')||'<div class="empty">Nenhuma cliente nessa lista.</div>'}</section><section class="card pane"><div class="head"><div><div class="eyebrow">RECORRÊNCIA</div><h2>Próximos retornos</h2></div><span class="count">${next.length}</span></div>${next.map(retCard).join('')||'<div class="empty">Nenhuma cliente nessa lista.</div>'}</section></div>`}function retCard(r){let msg=encodeURIComponent(`Oi, ${r.name.split(' ')[0]}! Passando para organizar seu próximo horário na Esmalta. 💅`);return `<div class="return-card"><div class="avatar">${ini(r.name)}</div><div><strong>${r.name}</strong><span>${r.type==='return'?'Próximo: '+P[r.suggest].name:'Oportunidade de reativação'}</span><small>${r.due<today()?days(r.due,today())+' dias atrasada':'Contato '+fmt(r.notify)+' · ideal '+fmt(r.due)}</small></div><div class="actions"><a class="wa" target="_blank" href="https://wa.me/55${r.phone}?text=${msg}">W</a><button class="mini" onclick="scheduleReturn(${r.id})">Agendar</button></div></div>`}
function clientsHTML(){return `<div style="max-width:850px"><div class="search"><input id="q" placeholder="Buscar cliente" oninput="filterClients(this.value)"></div><div id="clientList">${clientRows(C)}</div></div>`}function clientRows(cs){return cs.map(c=>{let r=returns().find(x=>x.phone===c.phone),f=A.find(a=>a.phone===c.phone&&a.date>=today()&&a.status!=='cancelled');return `<button class="client" onclick="openClient(${c.id})"><div class="avatar">${ini(c.name)}</div><div><strong>${c.name}</strong><span style="font-size:10px;color:#888">${c.phone}</span><div class="tags"><small>${c.visits||0} visitas</small><small>${money(c.spent||0)}</small>${f?'<small>Agendada '+fmt(f.date)+'</small>':r?'<small>Próxima ação '+fmt(r.notify)+'</small>':''}</div></div><b>›</b></button>`}).join('')}function filterClients(q){clientList.innerHTML=clientRows(C.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||c.phone.includes(q)))}
function settingsHTML(){return `<section class="card settings"><div class="head"><div><div class="eyebrow">CONFIGURAÇÕES</div><h2>Procedimentos e regras</h2></div></div><div class="procgrid">${Object.entries(P).map(([id,p])=>`<div class="proc"><strong>${p.name}</strong><span>${p.min} min · ${money(p.price)}</span><div class="rule">${p.days?'Retorno em <b>'+p.days+' dias</b>'+(p.next?' → '+P[p.next].name:''):'Reativação sugerida em <b>'+p.react+' dias</b>'}</div></div>`).join('')}</div><div style="margin-top:14px;border-top:1px solid #eee;padding-top:14px;font-size:11px;color:#777">Seg–sex 08:00–17:30 · Sáb 08:00–18:00 · sem pausa fixa de almoço.</div></section>`}
function openNew(date=sel,time='08:00',proc='manutencao',client='',phone='',edit=''){overlay.innerHTML=`<div class="back" onclick="if(event.target===this)closeSheet()"><section class="sheet"><div class="grab"></div><div class="sheettop"><h2>${edit?'Reagendar':'Novo agendamento'}</h2><button class="icon" onclick="closeSheet()">×</button></div><div class="form"><label>Cliente<input id="fc" list="cl" value="${client}"><datalist id="cl">${C.map(c=>`<option value="${c.name}">`).join('')}</datalist></label><label>WhatsApp<input id="fp" inputmode="numeric" value="${phone}"></label><div class="formrow"><label>Data<input id="fd" type="date" value="${date}"></label><label>Horário<input id="ft" type="time" value="${time}"></label></div><label>Procedimento<select id="fproc" onchange="formSummary()">${Object.entries(P).map(([id,p])=>`<option value="${id}" ${id===proc?'selected':''}>${p.name}</option>`).join('')}</select></label><div class="summary" id="fs"></div><button class="primary" onclick="saveBooking('${edit}')">${edit?'Salvar novo horário':'Criar agendamento'}</button></div></section></div>`;fc.onchange=()=>{let c=C.find(x=>x.name===fc.value);if(c)fp.value=c.phone};formSummary()}function formSummary(){let p=P[fproc.value];fs.innerHTML=`<span>${p.min} min</span><span>${money(p.price)}</span><span>${p.days?'retorno '+p.days+' dias':'reativar '+p.react+' dias'}</span>`}function closeSheet(){overlay.innerHTML=''}
function valid(form,ignore){let p=P[form.procedure],r=work(form.date);if(!r)return'Marina não atende aos domingos.';let s=tmin(form.time),e=s+p.min;if(s<r[0]||e>r[1])return'Esse procedimento ultrapassa o horário de atendimento.';let c=A.find(a=>String(a.id)!==String(ignore)&&a.date===form.date&&a.status!=='cancelled'&&s<tmin(a.time)+P[a.procedure].min&&e>tmin(a.time));return c?`Conflita com ${c.client}, às ${c.time}.`:''}function saveBooking(edit){let f={client:fc.value.trim(),phone:fp.value.replace(/\D/g,''),date:fd.value,time:ft.value,procedure:fproc.value};if(!f.client||f.phone.length<10)return toastMsg('Informe cliente e WhatsApp.');let e=valid(f,edit);if(e)return toastMsg(e);if(edit)A=A.map(a=>String(a.id)===String(edit)?{...a,...f}:a);else{A.push({id:Date.now(),...f,status:'scheduled'});if(!C.some(c=>c.phone===f.phone))C.push({id:Date.now()+1,name:f.client,phone:f.phone,lastProcedure:f.procedure,visits:0,spent:0})}save();sel=f.date;view='day';tab='agenda';closeSheet();toastMsg(edit?'Agendamento atualizado.':'Agendamento criado.');render()}
function openAppt(id){let a=A.find(x=>x.id===id),p=P[a.procedure];overlay.innerHTML=`<div class="back" onclick="if(event.target===this)closeSheet()"><section class="sheet"><div class="grab"></div><div class="sheettop"><span></span><button class="icon" onclick="closeSheet()">×</button></div><div class="apptdetail"><div class="eyebrow">${long(a.date)}</div><h2>${a.client}</h2><p>${a.time}–${mt(tmin(a.time)+p.min)} · ${p.name}</p><strong>${money(p.price)}</strong></div><div class="actiongrid"><a target="_blank" href="https://wa.me/55${a.phone}">WhatsApp</a>${a.status!=='confirmed'&&a.status!=='done'?`<button onclick="statusAppt(${id},'confirmed')">Confirmar</button>`:''}<button onclick="rebook(${id})">Reagendar</button>${a.status!=='done'?`<button class="good" onclick="statusAppt(${id},'done')">Concluir</button>`:''}${a.status!=='cancelled'&&a.status!=='done'?`<button class="danger" onclick="statusAppt(${id},'cancelled')">Cancelar</button>`:''}</div></section></div>`}function rebook(id){let a=A.find(x=>x.id===id);openNew(a.date,a.time,a.procedure,a.client,a.phone,id)}function statusAppt(id,s){let a=A.find(x=>x.id===id);a.status=s;if(s==='done'){let p=P[a.procedure],due=p.days?add(a.date,p.days):null,c=C.find(x=>x.phone===a.phone);if(c){c.name=a.client;c.lastProcedure=a.procedure;c.lastVisit=a.date;c.nextDue=due;c.visits=(c.visits||0)+1;c.spent=(c.spent||0)+p.price}else C.push({id:Date.now(),name:a.client,phone:a.phone,lastProcedure:a.procedure,lastVisit:a.date,nextDue:due,visits:1,spent:p.price});toastMsg(p.days?'Retorno recomendado para '+fmt(due)+'.':'Cliente entrou na régua de reativação.')}else toastMsg(s==='confirmed'?'Atendimento confirmado.':'Atendimento cancelado.');save();closeSheet();render()}
function scheduleReturn(id){let r=returns().find(x=>x.id===id),start=r.due<today()?today():r.due,s=firstSlot(start,r.suggest);openNew(s?.date||today(),s?.time||'08:00',r.suggest,r.name,r.phone)}function openClient(id){let c=C.find(x=>x.id===id),r=returns().find(x=>x.phone===c.phone);overlay.innerHTML=`<div class="back" onclick="if(event.target===this)closeSheet()"><section class="sheet"><div class="grab"></div><div class="sheettop"><span></span><button class="icon" onclick="closeSheet()">×</button></div><div class="profile"><div class="avatar">${ini(c.name)}</div><h2>${c.name}</h2><span>${c.phone}</span><div class="profilebuttons"><a target="_blank" href="https://wa.me/55${c.phone}">WhatsApp</a><button onclick="closeSheet();openNew('${r?.due||today()}','08:00','${r?.suggest||c.lastProcedure||'manutencao'}','${c.name}','${c.phone}')">Agendar</button></div></div><div class="metrics" style="margin-top:12px"><div class="metric"><strong>${c.visits||0}</strong><span>visitas</span></div><div class="metric"><strong>${money(c.spent||0)}</strong><span>total gasto</span></div><div class="metric"><strong>${fmt(c.lastVisit)}</strong><span>última visita</span></div></div>${r?`<div class="rule" style="margin-top:12px">Próxima ação: <b>${r.type==='return'?P[r.suggest].name+' · '+fmt(r.due):'Reativar · '+fmt(r.due)}</b></div>`:''}</section></div>`}function toastMsg(t){toast.textContent=t;toast.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>toast.style.display='none',2500)}render();
</script></body></html>
