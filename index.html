<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#181716" />
<title>Esmalta CRM</title>
<style>
:root{--bg:#f6f3ef;--paper:#fff;--ink:#191817;--muted:#7e7974;--line:#e8e1db;--sand:#efe4db;--accent:#886c58;--danger:#a5543d;--ok:#4e7658;--radius:18px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0;background:var(--bg);min-width:320px}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.side{background:#181716;color:#fff;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 28px}.mark{width:40px;height:40px;border:1px solid #a78c78;border-radius:14px;display:grid;place-items:center;font-family:Georgia,serif;font-size:23px;color:#eeddd0}.brand strong{display:block;font-family:Georgia,serif;font-size:18px}.brand small{color:#aaa}.nav{display:grid;gap:6px}.nav button,.mobile-nav button{border:0;background:transparent}.nav button{color:#bbb;padding:12px 13px;border-radius:12px;text-align:left;display:flex;align-items:center;gap:10px}.nav button.active,.nav button:hover{background:#2b2928;color:#fff}.nav .badge{margin-left:auto;background:#8f705a;padding:3px 7px;border-radius:999px;font-size:10px}.side-note{margin-top:auto;color:#8e8e8e;font-size:11px;padding:8px}.main{padding:32px 34px 90px;max-width:1450px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:.16em;color:#987a64;font-weight:800}.top h1,.section h2,.date-head h2{font-family:Georgia,serif;margin:5px 0 0}.top h1{font-size:31px}.primary,.soft,.wa{border:0;border-radius:12px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.primary{background:#191817;color:#fff;padding:12px 16px}.soft{background:#fff;color:#222;padding:10px 13px}.grid{display:grid;grid-template-columns:1.3fr .8fr;gap:18px}.hero{grid-column:1/-1;background:linear-gradient(135deg,#dcc8b7,#f3e7dc);border:1px solid #d9c7b7;border-radius:22px;padding:25px;min-height:154px;display:flex;justify-content:space-between;align-items:end}.hero h2{font-family:Georgia,serif;font-size:32px;margin:7px 0 3px}.hero p{color:#695b50;margin:0}.metrics{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.metric,.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}.metric{padding:17px}.metric .ico{width:34px;height:34px;border-radius:11px;background:#f3ece6;display:grid;place-items:center;margin-bottom:10px}.metric strong{font-size:22px;display:block}.metric span{font-size:11px;color:var(--muted)}.card{padding:20px}.section{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.section h2{font-size:21px}.pill{background:#f5efe9;color:#806550;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:700}.report{display:grid;grid-template-columns:1fr 1fr;gap:26px}.report h3{font-size:12px;color:var(--muted)}.person{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0ece8}.person:last-child{border-bottom:0}.avatar{width:38px;height:38px;border-radius:50%;background:#f0e6dd;color:#745b49;display:grid;place-items:center;font-size:11px;font-weight:800}.person strong,.person span{display:block}.person strong{font-size:13px}.person span{font-size:11px;color:#888;margin-top:3px}.warn{color:var(--danger)}.empty{font-size:12px;color:#999;padding:12px 0}.agenda-grid{display:grid;grid-template-columns:1fr 320px;gap:18px}.date-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center;margin-bottom:18px}.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:11px}.date-head button:last-child{justify-self:end}.date-head h2{font-size:18px;text-transform:capitalize}.appointment{display:grid;grid-template-columns:95px 1fr 40px;gap:12px;align-items:center;border:1px solid #ece6e0;border-radius:14px;padding:11px 12px;margin-bottom:8px}.appt-time strong,.appt-time span{display:block}.appt-time strong{font-size:13px}.appt-time span{font-size:10px;color:#999}.appt-main{display:flex;align-items:center;justify-content:space-between;gap:10px}.appt-main strong,.appt-main span{display:block}.appt-main strong{font-size:13px}.appt-main span{font-size:11px;color:#777;margin-top:3px}.status,.return-state{font-size:10px;font-weight:800;border-radius:999px;padding:6px 8px;white-space:nowrap}.scheduled{background:#f5efe9;color:#806550}.confirmed{background:#eaf3ec;color:#52705a}.done{background:#e8f2eb;color:#467153}.late{background:#faece8;color:#a6513a}.today{background:#fff0cc;color:#8e6b17}.upcoming{background:#edf1f1;color:#657071}.slots{display:flex;gap:7px;flex-wrap:wrap}.slot{border:1px solid var(--line);background:#fbfaf8;border-radius:9px;padding:8px 10px;font-size:11px}.hint{font-size:11px;color:#999;line-height:1.5;margin-top:16px}.list-card{padding:0;overflow:hidden}.list-card .section{padding:20px 20px 0}.return-row{display:grid;grid-template-columns:42px 1fr 85px 85px 100px 120px;gap:12px;align-items:center;padding:13px 20px;border-top:1px solid #eee9e4}.r-main strong,.r-main span,.r-date strong,.r-date span{display:block}.r-main strong{font-size:13px}.r-main span,.r-date span{font-size:10px;color:#888}.r-date strong{font-size:12px;margin-top:3px}.wa{background:#edf7ef;color:#26713a;padding:9px;font-size:11px;font-weight:800}.search{background:#f7f4f1;border-radius:11px;padding:0 11px}.search input{border:0;background:transparent;outline:0;padding:10px;width:230px}.client-row{display:grid;grid-template-columns:42px 1.3fr repeat(4,.7fr);gap:12px;align-items:center;padding:13px 20px;border-top:1px solid #eee9e4}.client-row strong,.client-row span{display:block}.client-row strong{font-size:12px}.client-row span{font-size:10px;color:#888}.procedures{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px 20px}.proc{border:1px solid var(--line);border-radius:14px;padding:15px}.proc strong,.proc span{display:block}.proc strong{font-size:13px}.proc span{font-size:11px;color:#888;margin-top:3px}.rule{background:#faf7f4;padding:10px;border-radius:10px;margin-top:12px;font-size:11px;color:#777}.modal-bg{display:none;position:fixed;inset:0;background:#0007;z-index:30;place-items:center;padding:18px}.modal-bg.open{display:grid}.modal{background:#fff;border-radius:20px;padding:22px;width:min(520px,100%);box-shadow:0 25px 80px #0003}.modal-head{display:flex;justify-content:space-between}.modal h2{font-family:Georgia,serif;margin:3px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:20px 0}.form label{font-size:11px;color:#777;display:grid;gap:6px}.form input,.form select{border:1px solid #dfd8d2;border-radius:11px;padding:11px;background:#fff}.full{grid-column:1/-1}.summary{display:flex;gap:8px;flex-wrap:wrap}.summary span{background:#f7f2ed;border-radius:9px;padding:8px 10px;font-size:10px;color:#6f6258}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#191817;color:#fff;padding:12px 14px;border-radius:12px;font-size:12px;z-index:40}.toast.show{display:block}.mobile-nav{display:none}
@media(max-width:980px){.app{display:block}.side{display:none}.main{padding:22px 18px 90px}.mobile-nav{display:grid;position:fixed;z-index:20;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);align-items:center;padding:5px 7px}.mobile-nav button{color:#888;display:grid;place-items:center;gap:2px;font-size:9px}.mobile-nav button.active{color:#111}.mobile-nav .add{width:46px;height:46px;border-radius:16px;background:#191817;color:#fff;justify-self:center;font-size:25px}.metrics{grid-template-columns:repeat(2,1fr)}.agenda-grid{grid-template-columns:1fr}.availability{order:-1}.return-row{grid-template-columns:42px 1fr 105px}.return-row .r-date,.return-row .return-state{display:none}.client-row{grid-template-columns:42px 1fr .7fr}.client-row>div:nth-child(4),.client-row>div:nth-child(5),.client-row>div:nth-child(6){display:none}}
@media(max-width:680px){.top h1{font-size:26px}.top .primary{width:42px;height:42px;font-size:0;padding:0}.grid{grid-template-columns:1fr}.hero{min-height:140px;padding:20px}.hero h2{font-size:27px;max-width:245px}.hero .soft{display:none}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:14px}.metric strong{font-size:18px}.report{grid-template-columns:1fr}.appointment{grid-template-columns:82px 1fr 36px;padding:10px 8px}.appt-main{display:block}.appt-main .status{display:inline-block;margin-top:6px}.procedures{grid-template-columns:1fr}.search input{width:180px}.form{grid-template-columns:1fr}.form label,.full{grid-column:1}.toast{left:16px;right:16px;bottom:82px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="mark">E</div><div><strong>Esmalta</strong><small>CRM da Marina</small></div></div>
  <div class="nav" id="desktopNav"></div>
  <div class="side-note">Agenda, retorno e recorrência sem complicação.</div>
</aside>
<main class="main">
  <header class="top"><div><div class="eyebrow">ESMALTA</div><h1 id="pageTitle">Visão geral</h1></div><button class="primary" onclick="openModal()">＋ <span>Novo agendamento</span></button></header>
  <div id="content"></div>
</main>
<nav class="mobile-nav" id="mobileNav"></nav>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal">
  <div class="modal-head"><div><div class="eyebrow">NOVO</div><h2>Agendamento</h2></div><button class="iconbtn" onclick="closeModal()">✕</button></div>
  <div class="form">
    <label class="full">Cliente<input id="fClient" placeholder="Nome da cliente" /></label>
    <label class="full">WhatsApp<input id="fPhone" inputmode="numeric" placeholder="77999999999" /></label>
    <label>Data<input id="fDate" type="date" /></label>
    <label>Horário<input id="fTime" type="time" value="08:00" /></label>
    <label class="full">Procedimento<select id="fProcedure" onchange="renderFormSummary()"></select></label>
    <div class="summary full" id="formSummary"></div>
  </div>
  <button class="primary" style="width:100%" onclick="saveAppointment()">Criar agendamento</button>
</div></div>
<div class="toast" id="toast"></div>
<script>
const procedures={
 alongamento:{name:'Alongamento',price:165,minutes:120,returnDays:25,next:'manutencao'},
 manutencao:{name:'Manutenção',price:85,minutes:80,returnDays:25,next:'manutencao'},
 banhoGel:{name:'Banho de gel',price:120,minutes:90,returnDays:25,next:'manutencao'},
 peMao:{name:'Pé e mão tradicional',price:50,minutes:90,reactivationDays:15},
 peOuMao:{name:'Pé ou mão tradicional',price:30,minutes:50,reactivationDays:15}
};
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fmt=iso=>iso?new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(new Date(iso+'T12:00:00')):'—';
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const time=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const daysBetween=(a,b)=>Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const phoneFmt=p=>p.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3');
function weekRange(){const d=new Date(today()+'T12:00:00'),day=d.getDay(),off=day===0?1:1-day;const s=new Date(d);s.setDate(d.getDate()+off);const e=new Date(s);e.setDate(s.getDate()+5);return[s.toISOString().slice(0,10),e.toISOString().slice(0,10)]}
const seedA=[
 {id:1,client:'Camila Rocha',phone:'77999990001',date:today(),time:'08:00',procedure:'manutencao',status:'confirmed'},
 {id:2,client:'Larissa Almeida',phone:'77999990002',date:today(),time:'10:00',procedure:'banhoGel',status:'scheduled'},
 {id:3,client:'Bruna Martins',phone:'77999990003',date:addDays(today(),1),time:'14:00',procedure:'peMao',status:'scheduled'}
];
const seedC=[
 {id:1,name:'Camila Rocha',phone:'77999990001',lastProcedure:'manutencao',lastVisit:addDays(today(),-24),nextDue:addDays(today(),1),totalVisits:7,totalSpent:595},
 {id:2,name:'Larissa Almeida',phone:'77999990002',lastProcedure:'banhoGel',lastVisit:addDays(today(),-25),nextDue:today(),totalVisits:4,totalSpent:410},
 {id:3,name:'Bruna Martins',phone:'77999990003',lastProcedure:'peMao',lastVisit:addDays(today(),-18),nextDue:null,totalVisits:3,totalSpent:150},
 {id:4,name:'Paula Menezes',phone:'77999990004',lastProcedure:'manutencao',lastVisit:addDays(today(),-38),nextDue:addDays(today(),-13),totalVisits:8,totalSpent:735},
 {id:5,name:'Renata Lopes',phone:'77999990005',lastProcedure:'peOuMao',lastVisit:addDays(today(),-22),nextDue:null,totalVisits:2,totalSpent:60}
];
let appointments=JSON.parse(localStorage.getItem('esmaltaAppointments')||'null')||seedA;
let clients=JSON.parse(localStorage.getItem('esmaltaClients')||'null')||seedC;
let tab='dashboard',selectedDate=today();
const navItems=[['dashboard','⌂','Visão geral'],['agenda','▦','Agenda'],['retornos','↻','Retornos'],['clientes','♙','Clientes'],['procedures','⚙','Procedimentos']];
function persist(){localStorage.setItem('esmaltaAppointments',JSON.stringify(appointments));localStorage.setItem('esmaltaClients',JSON.stringify(clients))}
function getReturns(){return clients.filter(c=>c.lastVisit).map(c=>{const p=procedures[c.lastProcedure];if(p.returnDays){const due=c.nextDue||addDays(c.lastVisit,p.returnDays);return{...c,due,notify:addDays(due,-1),type:'return',suggested:p.next||c.lastProcedure}}const due=addDays(c.lastVisit,p.reactivationDays||15);return{...c,due,notify:due,type:'reactivation',suggested:c.lastProcedure}})}
function hasFuture(r){return appointments.some(a=>a.phone===r.phone&&a.date>=today()&&a.status!=='cancelled')}
function setTab(id){tab=id;render()}
function renderNav(){const late=getReturns().filter(r=>r.due<today()&&!hasFuture(r)).length;desktopNav.innerHTML=navItems.map(([id,ico,label])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')"><b>${ico}</b>${label}${id==='retornos'&&late?`<span class="badge">${late}</span>`:''}</button>`).join('');mobileNav.innerHTML=navItems.slice(0,2).map(([id,ico,label])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')"><b>${ico}</b><span>${label}</span></button>`).join('')+`<button class="add" onclick="openModal()">＋</button>`+navItems.slice(2,4).map(([id,ico,label])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')"><b>${ico}</b><span>${label}</span></button>`).join('')}
function render(){renderNav();const titles={dashboard:'Visão geral',agenda:'Agenda',retornos:'Retornos e reativação',clientes:'Clientes',procedures:'Procedimentos'};pageTitle.textContent=titles[tab];content.innerHTML=tab==='dashboard'?dashboardHTML():tab==='agenda'?agendaHTML():tab==='retornos'?returnsHTML():tab==='clientes'?clientsHTML():proceduresHTML();if(tab==='clientes'){const q=document.getElementById('clientSearch');if(q)q.oninput=renderClientsFiltered}}
function dashboardHTML(){const [ws,we]=weekRange(),wa=appointments.filter(a=>a.date>=ws&&a.date<=we&&a.status!=='cancelled'),todayA=appointments.filter(a=>a.date===today()&&a.status!=='cancelled'),returns=getReturns(),contacts=returns.filter(r=>r.notify>=ws&&r.notify<=we&&!hasFuture(r)),over=returns.filter(r=>r.due<today()&&!hasFuture(r)),react=over.filter(r=>r.type==='reactivation'||daysBetween(r.due,today())>=5).slice(0,5),rev=wa.reduce((s,a)=>s+procedures[a.procedure].price,0);return `<div class="grid"><section class="hero"><div><div class="eyebrow">HOJE</div><h2>${todayA.length} atendimento${todayA.length!==1?'s':''} na agenda</h2><p>Seu foco de hoje, sem ruído.</p></div><button class="soft" onclick="setTab('agenda')">Ver agenda →</button></section><div class="metrics">${metric('▦',wa.length,'Agendados na semana')}${metric('R$',money(rev),'Receita prevista')}${metric('↻',contacts.length,'Contatos de retorno')}${metric('!',over.length,'Clientes em atraso')}</div><section class="card"><div class="section"><div><div class="eyebrow">RELATÓRIO DA SEMANA</div><h2>Quem merece sua atenção</h2></div><span class="pill">Atualiza aos domingos</span></div><div class="report"><div><h3>Retornos para contactar</h3>${contacts.slice(0,4).map(r=>person(r,`${procedures[r.lastProcedure].name} · falar ${fmt(r.notify)}`)).join('')||empty('Nenhum contato previsto nesta semana.')}</div><div><h3>Sugestões de reativação</h3>${react.map(r=>person(r,`Última visita ${fmt(r.lastVisit)} · ${procedures[r.lastProcedure].name}`)).join('')||empty('Nenhuma cliente parada relevante.')}</div></div></section><section class="card"><div class="section"><div><div class="eyebrow">RETORNOS</div><h2>Precisam de ação</h2></div><button class="soft" onclick="setTab('retornos')">Ver todos</button></div>${over.slice(0,5).map(r=>person(r,`Retorno previsto ${fmt(r.due)}`,true)).join('')||empty('Tudo em dia por aqui.')}</section></div>`}
function metric(i,v,l){return `<div class="metric"><div class="ico">${i}</div><strong>${v}</strong><span>${l}</span></div>`}function person(r,sub,w=false){return `<div class="person"><div class="avatar">${initials(r.name)}</div><div><strong>${r.name}</strong><span>${sub}</span></div>${w?'<b class="warn">!</b>':''}</div>`}function empty(t){return `<div class="empty">${t}</div>`}
function agendaHTML(){const as=appointments.filter(a=>a.date===selectedDate).sort((a,b)=>a.time.localeCompare(b.time)),d=new Date(selectedDate+'T12:00:00'),label=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long'}).format(d),slots=availability(selectedDate,as);return `<div class="agenda-grid"><section class="card"><div class="date-head"><button class="iconbtn" onclick="changeDate(-1)">‹</button><div><div class="eyebrow">AGENDA</div><h2>${label}</h2></div><button class="iconbtn" onclick="changeDate(1)">›</button></div>${as.length?as.map(a=>`<div class="appointment"><div class="appt-time"><strong>${a.time}</strong><span>até ${time(mins(a.time)+procedures[a.procedure].minutes)}</span></div><div class="appt-main"><div><strong>${a.client}</strong><span>${procedures[a.procedure].name} · ${money(procedures[a.procedure].price)}</span></div><span class="status ${a.status}">${statusLabel(a.status)}</span></div>${a.status!=='done'?`<button class="iconbtn" onclick="complete(${a.id})">✓</button>`:'<span></span>'}</div>`).join(''):empty('Dia livre — nenhum atendimento agendado.')}</section><section class="card availability"><div class="section"><div><div class="eyebrow">DISPONIBILIDADE</div><h2>Horários livres</h2></div></div><div class="slots">${slots.slice(0,14).map(s=>`<span class="slot">${s}</span>`).join('')||empty('Sem janelas relevantes.')}</div><div class="hint">Seg–sex: 08:00–17:30 · Sáb: 08:00–18:00. Sem pausa fixa de almoço.</div></section></div>`}
function statusLabel(s){return{scheduled:'Agendado',confirmed:'Confirmado',done:'Atendido',cancelled:'Cancelado'}[s]||s}function changeDate(n){selectedDate=addDays(selectedDate,n);render()}
function availability(date,as){const day=new Date(date+'T12:00:00').getDay();if(day===0)return[];const start=480,end=day===6?1080:1050,busy=as.filter(a=>a.status!=='cancelled').map(a=>[mins(a.time),mins(a.time)+procedures[a.procedure].minutes]),out=[];for(let m=start;m<=end-50;m+=30)if(!busy.some(([s,e])=>m<e&&m+50>s))out.push(time(m));return out}
function complete(id){const a=appointments.find(x=>x.id===id);if(!a)return;a.status='done';const p=procedures[a.procedure],due=p.returnDays?addDays(a.date,p.returnDays):null,c=clients.find(x=>x.phone===a.phone);if(c){c.lastProcedure=a.procedure;c.lastVisit=a.date;c.nextDue=due;c.totalVisits=(c.totalVisits||0)+1;c.totalSpent=(c.totalSpent||0)+p.price}else clients.push({id:Date.now(),name:a.client,phone:a.phone,lastProcedure:a.procedure,lastVisit:a.date,nextDue:due,totalVisits:1,totalSpent:p.price});persist();toast(p.returnDays?`Atendimento concluído. Retorno previsto para ${fmt(due)}.`:'Atendimento concluído. Cliente entrou na régua de reativação.');render()}
function returnsHTML(){const rs=getReturns().sort((a,b)=>a.due.localeCompare(b.due));return `<section class="card list-card"><div class="section"><div><div class="eyebrow">GESTÃO DE RETORNO</div><h2>Quem contactar e quando</h2></div></div>${rs.map(r=>{const future=hasFuture(r),state=future?'confirmed':r.due<today()?'late':r.notify===today()?'today':'upcoming',label=future?'Já agendada':state==='late'?'Atrasada':state==='today'?'Contactar hoje':'Próxima',msg=encodeURIComponent(`Oi, ${r.name.split(' ')[0]}! Passando para organizar seu próximo horário na Esmalta. 💅`);return `<div class="return-row"><div class="avatar">${initials(r.name)}</div><div class="r-main"><strong>${r.name}</strong><span>${r.type==='return'?`Próximo: ${procedures[r.suggested].name}`:'Sugestão de reativação'}</span></div><div class="r-date"><span>Contato</span><strong>${fmt(r.notify)}</strong></div><div class="r-date"><span>Retorno</span><strong>${fmt(r.due)}</strong></div><span class="return-state ${state}">${label}</span><a class="wa" target="_blank" href="https://wa.me/55${r.phone}?text=${msg}">WhatsApp</a></div>`}).join('')}</section>`}
function clientsHTML(){return `<section class="card list-card"><div class="section"><div><div class="eyebrow">BASE DE CLIENTES</div><h2>${clients.length} clientes</h2></div><div class="search"><input id="clientSearch" placeholder="Buscar cliente" /></div></div><div id="clientRows">${clientRows(clients)}</div></section>`}function clientRows(arr){const rs=getReturns();return arr.map(c=>{const r=rs.find(x=>x.phone===c.phone);return `<div class="client-row"><div class="avatar">${initials(c.name)}</div><div><strong>${c.name}</strong><span>${phoneFmt(c.phone)}</span></div><div><span>Última visita</span><strong>${fmt(c.lastVisit)}</strong></div><div><span>Visitas</span><strong>${c.totalVisits||0}</strong></div><div><span>Total</span><strong>${money(c.totalSpent||0)}</strong></div><div><span>Próxima ação</span><strong>${r?fmt(r.notify):'—'}</strong></div></div>`}).join('')}function renderClientsFiltered(e){const q=e.target.value.toLowerCase();document.getElementById('clientRows').innerHTML=clientRows(clients.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q)))}
function proceduresHTML(){return `<section class="card list-card"><div class="section"><div><div class="eyebrow">CONFIGURAÇÃO</div><h2>Procedimentos</h2></div><span class="pill">Regras iniciais</span></div><div class="procedures">${Object.entries(procedures).map(([id,p])=>`<div class="proc"><strong>${p.name}</strong><span>${p.minutes} min · ${money(p.price)}</span><div class="rule">${p.returnDays?`Retorno em <b>${p.returnDays} dias</b>${p.next?` → ${procedures[p.next].name}`:''}`:`Reativação sugerida em <b>${p.reactivationDays} dias</b>`}</div></div>`).join('')}</div></section>`}
function openModal(){document.getElementById('modalBg').classList.add('open');document.getElementById('fDate').value=selectedDate;const sel=document.getElementById('fProcedure');sel.innerHTML=Object.entries(procedures).map(([id,p])=>`<option value="${id}">${p.name} · ${p.minutes} min · ${money(p.price)}</option>`).join('');renderFormSummary();setTimeout(()=>document.getElementById('fClient').focus(),50)}function closeModal(){modalBg.classList.remove('open')}
function renderFormSummary(){const p=procedures[fProcedure.value||'alongamento'];formSummary.innerHTML=`<span>${p.minutes} min</span><span>${money(p.price)}</span>${p.returnDays?`<span>retorno em ${p.returnDays} dias</span>`:'<span>reativação em 15 dias</span>'}`}
function saveAppointment(){const client=fClient.value.trim(),phone=fPhone.value.replace(/\D/g,''),date=fDate.value,timeValue=fTime.value,procedure=fProcedure.value;if(!client||phone.length<10||!date||!timeValue)return toast('Preencha cliente, WhatsApp, data e horário.');appointments.push({id:Date.now(),client,phone,date,time:timeValue,procedure,status:'scheduled'});if(!clients.some(c=>c.phone===phone))clients.push({id:Date.now()+1,name:client,phone,lastProcedure:procedure,lastVisit:null,nextDue:null,totalVisits:0,totalSpent:0});persist();selectedDate=date;tab='agenda';fClient.value='';fPhone.value='';closeModal();toast('Agendamento criado.');render()}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
render();
</script>
</body>
</html>
